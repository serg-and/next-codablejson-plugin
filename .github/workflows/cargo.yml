name: Cargo test

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".cargo/**"
      - "Cargo.*"
      - "package.json"
      - "bun.lock"
      - "tools/**"
      - "tsconfig.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".cargo/**"
      - "Cargo.*"
      - "package.json"
      - "bun.lock"
      - "tools/**"
      - "tsconfig.json"
      - ".github/workflows/**"

env:
  RUST_LOG: debug
  CARGO_INCREMENTAL: 0
  CI: "1"

jobs:
  compiler:
    name: Next.js 16.4.2 compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install WASM target
        run: rustup target add wasm32-wasip1
      - name: Test runtime helpers
        run: bun run test:runtime
      - name: Build WASM and test the Next.js compiler
        run: bun run test:compiler

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Handle line endings
        shell: bash
        if: runner.os == 'Windows'
        run: |
          git config --system core.autocrlf false
          git config --system core.eol lf
      - uses: actions/checkout@v2
        with:
          submodules: true
      - name: Setup node
        uses: actions/setup-node@v2
        with:
          node-version: 22
      - name: Output rust version
        run: rustup --version
      - name: Configure path (windows)
        shell: bash
        if: runner.os == 'Windows'
        run: |
          echo 'C:\\npm\\prefix' >> $GITHUB_PATH
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            target
          key: cargo-dev-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-dev-${{ runner.os }}
      - name: Run cargo test
        run: |
          cargo test --all --color always
